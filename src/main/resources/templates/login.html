<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <h1>Log in</h1>
  <p class="notice" th:if="${param.registered}">Account created. Log in to start shopping.</p>
  <p class="notice" th:if="${param.logout}">You are logged out.</p>
  <p class="error" th:if="${param.error}">Wrong username or password. Check both and try again.</p>
  <form th:action="@{/login}" method="post" class="stack">
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
