<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Shop')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Kitchen and home</h1>
  <ul class="products">
    <li th:each="p : ${products}">
      <div>
        <h2 th:text="${p.name}">Product</h2>
        <p th:text="${p.description}">Description</p>
      </div>
      <span class="price" th:text="'₹' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}">₹0</span>
      <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post">
        <button type="submit">Add to cart</button>
      </form>
    </li>
  </ul>
</main>
</body>
</html>
